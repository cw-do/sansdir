[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sansdir"
version = "0.12.0"
description = "MDIR-style terminal file manager for SANS data on the ORNL analysis cluster"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Changwoo Do", email = "doc1@ornl.gov" }]
keywords = ["sans", "neutron", "tui", "ornl", "file-manager", "nexus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "textual>=0.80",
    "click>=8.1",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "h5py>=3.9",
    "pyoncat>=2.6",
    # pyoncat imports oauthlib / requests-oauthlib for the device flow but does
    # not declare them (its metadata lists only requests), so name them here or
    # sign-in fails at import time with ModuleNotFoundError: oauthlib.
    "oauthlib>=3.2",
    "requests-oauthlib>=1.3",
    "tomli>=2.0; python_version<'3.11'",
    "send2trash>=1.8",
    # The detector viewer / mask editor (`V`, `K`, `sansdir view`). Core since
    # v0.12.0: K has no matplotlib fallback any more, and an optional extra is
    # exactly what update.sh's plain `pip install` would skip (cf. v0.11.1).
    # Qt is imported only inside sansdir/viewer/qt/, in the viewer process, so
    # the TUI cold start is unaffected. PySide6 6.12.0 + pyqtgraph 0.14
    # corrupts refcounts (the viewer aborts within minutes; reproduced
    # 2026-10-21); 6.11.1 (also Mantid's version) is clean. Essentials only.
    "PySide6-Essentials>=6.5,<6.12",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=0.4",
    "ruff==0.15.*",  # pinned: must match .pre-commit-config.yaml
    "mypy>=1.10",
    "pyinstrument>=4.6",
    "pre-commit>=3.7",
]
llm = [
    "anthropic>=0.40",
]
# Optional matplotlib interactive backends (one of):
qt = ["PyQt5>=5.15"]      # pip install "sansdir[qt]"
tk = []                   # tkinter ships with Python on most builds
# Kept so `pip install "sansdir[viewer]"` (the viewer's own hint) still works;
# since v0.12.0 these are regular dependencies.
viewer = ["PySide6-Essentials>=6.5,<6.12", "pyqtgraph>=0.13"]

[project.scripts]
sansdir = "sansdir.cli:main"

[project.urls]
Homepage = "https://github.com/cw-do/sansdir"
Issues = "https://github.com/cw-do/sansdir/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sansdir"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/sansdir"]

# Third-party modules that ship no type information. These are not our
# errors to fix: h5py and send2trash have no py.typed marker, mantid is only
# importable inside a Mantid environment, and tomli is a 3.10-only fallback
# that isn't installed on 3.11+ where tomllib is used instead.
[[tool.mypy.overrides]]
module = [
    "h5py.*",
    "send2trash.*",
    "mantid.*",
    "tomli",
    "pyoncat.*",
    "pyqtgraph.*",
]
ignore_missing_imports = true

# The viewer's Qt layer subclasses pyqtgraph widgets, and pyqtgraph ships no
# type information, so those base classes are `Any`. Everything else in the
# package (including the Qt-free viewer modules) stays fully strict.
[[tool.mypy.overrides]]
module = ["sansdir.viewer.qt.*"]
disallow_subclassing_any = false

